name: Build, Release APK & Deploy GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f app/handy_deterministic.jks ]; then
            keytool -genkeypair -v \
              -keystore app/handy_deterministic.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias handy_key \
              -storepass handy123456 \
              -keypass handy123456 \
              -dname "CN=HandySTT, OU=Mobile, O=Natlep, L=Paris, ST=IDF, C=FR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/handy_deterministic.jks
            git commit -m "Lock permanent signing keystore [skip ci]" || true
            git push || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HandyMobile-natlep.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandyMobile-apk
          path: app/build/outputs/apk/debug/HandyMobile-natlep.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Handy Mobile v1.0.${{ github.run_number }}
          body: "Handy Mobile Build #${{ github.run_number }}."
          files: app/build/outputs/apk/debug/HandyMobile-natlep.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
